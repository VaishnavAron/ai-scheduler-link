<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Distributed AI Task Scheduler & Chaos Engine</title>

  <!-- Primary SEO Meta Tags -->
  <meta name="title" content="Distributed AI Task Scheduler & Chaos Engine" />
  <meta name="description" content="Production-grade asynchronous NLP inference orchestrator powered by FastAPI, Celery, and Redis with real-time telemetry matrix and fault injection." />

  <!-- Open Graph / LinkedIn / Facebook -->
  <meta property="og:type" content="website" />
  <meta property="og:url" content="https://ai-scheduler-link.vercel.app/" />
  <link rel="canonical" href="https://ai-scheduler-link.vercel.app/" />
  <meta property="og:title" content="Distributed AI Task Scheduler & Chaos Engine" />
  <meta property="og:description" content="Production-grade asynchronous NLP inference orchestrator with real-time telemetry matrix, dynamic autoscaling, and fault-tolerant chaos engineering." />
  <meta property="og:image" content="/preview.png" />
  <meta property="og:image:width" content="1200" />
  <meta property="og:image:height" content="630" />

  <!-- Twitter -->
  <meta property="twitter:card" content="summary_large_image" />
  <meta property="twitter:title" content="Distributed AI Task Scheduler & Chaos Engine" />
  <meta property="twitter:description" content="Production-grade asynchronous NLP inference orchestrator with real-time telemetry matrix and chaos engineering." />
  <meta property="twitter:image" content="/preview.png" />

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500;600&display=swap" rel="stylesheet" />

  <style>
    :root {
      --bg: #0b0f17;
      --card-bg: #111827;
      --border: #1f2937;
      --primary: #3b82f6;
      --primary-hover: #2563eb;
      --text: #f9fafb;
      --text-muted: #9ca3af;
      --accent-green: #10b981;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      background-color: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 20px;
      overflow: hidden;
    }

    .container {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 36px 32px;
      max-width: 480px;
      width: 100%;
      text-align: center;
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5), 0 0 40px rgba(59, 130, 246, 0.1);
      position: relative;
    }

    .badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: rgba(16, 185, 129, 0.1);
      border: 1px solid rgba(16, 185, 129, 0.3);
      color: var(--accent-green);
      font-family: 'JetBrains Mono', monospace;
      font-size: 11px;
      font-weight: 600;
      padding: 4px 10px;
      border-radius: 9999px;
      margin-bottom: 18px;
    }

    .badge-dot {
      width: 6px;
      height: 6px;
      background: var(--accent-green);
      border-radius: 50%;
      animation: pulse 1.5s infinite;
    }

    @keyframes pulse {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.4; transform: scale(0.85); }
    }

    h1 {
      font-size: 20px;
      font-weight: 700;
      color: var(--text);
      margin-bottom: 8px;
      line-height: 1.3;
    }

    p {
      color: var(--text-muted);
      font-size: 13px;
      line-height: 1.5;
      margin-bottom: 24px;
    }

    .progress-bar-wrap {
      width: 100%;
      height: 4px;
      background: #1f2937;
      border-radius: 4px;
      overflow: hidden;
      margin-bottom: 24px;
    }

    .progress-bar-fill {
      height: 100%;
      width: 100%;
      background: linear-gradient(90deg, #3b82f6, #10b981);
      animation: sweep 1.2s ease-in-out infinite;
      border-radius: 4px;
    }

    @keyframes sweep {
      0% { transform: translateX(-100%); }
      100% { transform: translateX(100%); }
    }

    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      background: var(--primary);
      color: #ffffff;
      font-weight: 600;
      font-size: 14px;
      padding: 12px 24px;
      border-radius: 10px;
      text-decoration: none;
      transition: all 0.2s ease;
      width: 100%;
      box-shadow: 0 4px 14px rgba(59, 130, 246, 0.4);
    }

    .btn:hover {
      background: var(--primary-hover);
      transform: translateY(-1px);
      box-shadow: 0 6px 20px rgba(59, 130, 246, 0.6);
    }

    .server-info {
      margin-top: 20px;
      font-family: 'JetBrains Mono', monospace;
      font-size: 11px;
      color: #6b7280;
    }
  </style>
</head>
<body>

  <div class="container">
    <div class="badge">
      <span class="badge-dot"></span> AWS EC2 Cluster Live (ap-south-1)
    </div>

    <h1>Connecting to Live Dashboard</h1>
    <p>Redirecting to Distributed AI Task Scheduler & Chaos Engine on AWS EC2...</p>

    <div class="progress-bar-wrap">
      <div class="progress-bar-fill"></div>
    </div>

    <a href="http://15.252.100.5:8000/dashboard" id="redirectLink" class="btn">
      Open Live Dashboard &rarr;
    </a>

    <div class="server-info">
      Target: 15.252.100.5:8000/dashboard
    </div>
  </div>

  <script>
    // Execute instant redirection for human visitors (ignore crawlers/bots)
    const isBot = /bot|crawler|spider|crawling|linkedin|facebook|twitter/i.test(navigator.userAgent);
    if (!isBot) {
      window.location.replace("http://15.252.100.5:8000/dashboard");
    }
  </script>
</body>
</html>
